name: Node CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        eslint-version: [10]
        include:
          - node-version: 20.x
            eslint-version: 9

    steps:
      - uses: actions/checkout@v4
      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - name: Install next for smoke tests
        run: npm install --no-save next@^16.3.6
      - name: Install ESLint ${{ matrix.eslint-version }}
        if: matrix.eslint-version == 9
        run: npm install --no-save eslint@9.33.0
      - name: Run tests (ESLint ${{ matrix.eslint-version }})
        run: |
          if [ "${{ matrix.eslint-version }}" = "10" ]; then
            npm run test && npm run test:smoke
          else
            npx eslint ./test/. -c ./test/_config.mjs --ext .ts && npm run test:smoke
          fi
